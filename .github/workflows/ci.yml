name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GitHub-hosted Ubuntu runners ship Google Chrome at this path.
      # If it is missing, the browser suite skips itself instead of failing.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Browser E2E tests
        run: npm run test:e2e

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: test/e2e/snapshots/__actual__/
          if-no-files-found: ignore

      - name: Load tests
        run: npm run test:load
